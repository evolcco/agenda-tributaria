name: Atualizar Agenda Tributária

on:
  schedule:
    # Roda dia 1 e 15 às 12:00 UTC (09:00 BRT)
    - cron: "0 12 1,15 * *"
  workflow_dispatch:
    inputs:
      page_url:
        description: "URL da página mensal (sobrescreve a auto-detecção)"
        required: false
        type: string
      backfill_from:
        description: "Reprocessar desde este mês (AAAA-MM) até o mês seguinte ao atual"
        required: false
        type: string

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Compute target months
        id: months
        env:
          BACKFILL_FROM: ${{ inputs.backfill_from }}
        run: |
          python <<'PY' >> "$GITHUB_OUTPUT"
          import os
          from datetime import date
          # A Receita alterna a grafia do mês na URL: jan-jul/2026 em minúsculo
          # ("/2026/junho") e, desde agosto/2026, com inicial maiúscula ("/2026/Agosto").
          # Cada mês leva as duas grafias, separadas por "|"; o parser tenta na ordem.
          MONTHS = ["janeiro","fevereiro","marco","abril","maio","junho",
                   "julho","agosto","setembro","outubro","novembro","dezembro"]
          BASE = "https://www.gov.br/receitafederal/pt-br/assuntos/agenda-tributaria"

          def next_month(y, m):
              return (y + 1, 1) if m == 12 else (y, m + 1)

          today = date.today()
          end = next_month(today.year, today.month)
          backfill = os.environ.get("BACKFILL_FROM", "").strip()
          if backfill:
              y, m = (int(x) for x in backfill.split("-"))
              start = (y, m)
          else:
              start = (today.year, today.month)

          targets = []
          cur = start
          while cur <= end:
              targets.append(cur)
              cur = next_month(*cur)

          groups = []
          for y, m in targets:
              slug = MONTHS[m - 1]
              groups.append("|".join([f"{BASE}/{y}/{slug.capitalize()}", f"{BASE}/{y}/{slug}"]))
          print(f"urls={','.join(groups)}")
          PY

      - name: Run parser for each month
        env:
          OVERRIDE_URL: ${{ inputs.page_url }}
          AUTO_URLS: ${{ steps.months.outputs.urls }}
        run: |
          set -e
          if [ -n "$OVERRIDE_URL" ]; then
            URLS="$OVERRIDE_URL"
          else
            URLS="$AUTO_URLS"
          fi
          IFS=',' read -ra GROUPS_ARR <<< "$URLS"
          for group in "${GROUPS_ARR[@]}"; do
            IFS='|' read -ra CANDIDATES <<< "$group"
            ok=false
            for url in "${CANDIDATES[@]}"; do
              echo "::group::Processando $url"
              if python scripts/update_agenda_from_rfb_page.py --page-url "$url"; then
                ok=true
              fi
              echo "::endgroup::"
              if [ "$ok" = true ]; then break; fi
            done
            if [ "$ok" != true ]; then
              echo "::warning::Falha ao processar ${CANDIDATES[0]} (mês não publicado ou sem planilha .xlsx)"
            fi
          done

      - name: Generate ICS files
        run: python scripts/generate_ics.py

      - name: Rebuild data index
        run: python scripts/build_data_index.py

      - name: Detect changes
        id: diff
        run: |
          if [ -n "$(git status --porcelain data/)" ]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --short data/
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Sem alterações em data/"
          fi

      - name: Commit and push
        if: steps.diff.outputs.changed == 'true'
        run: |
          # Dados vêm da planilha oficial da Receita: commit direto, sem PR.
          # O push feito com GITHUB_TOKEN não dispara o pages.yml; o deploy
          # roda pelo gatilho workflow_run em pages.yml.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "chore(data): atualiza agenda tributária"
          git push origin "HEAD:${GITHUB_REF_NAME}"
